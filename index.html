<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TCSN Enterprise | Main Portal</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        /* Navigation */
        nav { display: flex; justify-content: space-between; background: var(--card); padding: 15px 30px; border-radius: 8px; margin-bottom: 20px; }
        nav a { color: var(--text); text-decoration: none; padding: 0 15px; font-weight: bold; }
        nav a:hover { color: var(--accent); }

        /* Sections */
        .container { background: var(--card); padding: 30px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid var(--accent); }
        h2 { color: var(--accent); margin-top: 0; }
        
        /* Executive Profile */
        .executive-name { font-size: 28px; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div><strong>TCSN Enterprise</strong></div>
        <div>
            <a href="#home">หน้าหลัก</a>
            <a href="#executive">ฝ่ายบริหาร</a>
            <a href="#contact">ติดต่อ</a>
        </div>
    </nav>

    <!-- Executive Board Section -->
    <section id="executive" class="container">
        <h2>ฝ่ายบริหาร</h2>
        <p>ประธานผู้บริหารสูงสุด</p>
        <div class="executive-name">ธัญพิสิษฐ์</div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="container">
        <h2>ช่องทางติดต่อองค์กร</h2>
        <p>อีเมล: thaicybersecuritynormal@gmail.com</p>
        <button onclick="window.location.href='mailto:thaicybersecuritynormal@gmail.com'" style="padding:10px; background:var(--accent); border:none; border-radius:5px; cursor:pointer;">ส่งอีเมลถึงเรา</button>
    </section>

</body>
</html>
